name: Build and Verify Services

on:
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Checkout repository
        uses: actions/checkout@v3

      # docker-java defaults to API 1.32 but recent Docker requires >= 1.40;
      # without this, Testcontainers cannot talk to the runner's Docker daemon
      - name: Configure docker-java API version for Testcontainers
        run: echo "api.version=1.44" > ~/.docker-java.properties

      - name: Clone and build portalasig-commons
        run: |
          git clone --branch master https://github.com/portalasig-microservices/portalasig-commons.git
          cd portalasig-commons
          mvn clean install

      - name: Clone and build portalasig-ms-notify
        run: |
          git clone --branch develop https://github.com/portalasig-microservices/portalasig-ms-notify.git
          cd portalasig-ms-notify
          mvn clean install

      # verify = checkstyle + tests (Testcontainers/MySQL) + JaCoCo report and coverage check
      # (build fails below 70% lines / 60% branches)
      - name: Build and verify service
        run: mvn clean verify
